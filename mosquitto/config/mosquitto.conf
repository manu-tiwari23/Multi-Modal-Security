# Minimal Mosquitto config for local MMS development.
#
# WARNING: allow_anonymous true is acceptable ONLY because this broker stays
# on your local Docker network (mms-network) and is never exposed beyond
# localhost/your LAN. Before this is ever reachable from outside your machine,
# switch to a password_file and enable TLS — see the security notes in
# ARCHITECTURE.md §8 and .agents/skills/esp32-alert/SKILL.md.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log